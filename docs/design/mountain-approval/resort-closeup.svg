 clear gap</text><text x="470" y="258" text-anchor="middle" class="label">One shared forecourt · no run crossings</text></g><text x="18" y="378">L · Lodge</text><text x="18" y="403">T · Ticket booth / future game start</text><text x="18" y="428">Shared forecourt · buildings grouped together</text><text x="18" y="453">No downhill race through the pedestrian terrace</text><text x="18" y="484">PROPOSAL ONLY · NOT IMPLEMENTED · COVE APPROVED / RETAINED</text></svg>