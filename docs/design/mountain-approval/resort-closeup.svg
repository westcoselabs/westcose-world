<svg xmlns="http://www.w3.org/2000/svg" width="940" height="510" viewBox="0 0 940 510"><style>:root{color-scheme:light;--background:#f5f2e8;--foreground:#273e43;--green:#286a51;--blue:#187fab;--yellow:#ba8d3e;--red:#b8453f;--orange:#b36d1c}body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.5 system-ui,sans-serif}main{max-width:940px;margin:auto;padding:24px}h2{font-size:26px;font-weight:500}h3{font-size:19px;font-weight:500}.text-small{font-size:12px}.downloads{display:flex;gap:18px;flex-wrap:wrap}a{color:#176583}@media(max-width:450px){main{padding:14px}}
svg{font:14px system-ui,sans-serif}svg text{fill:var(--foreground)}
  #wc-mountain-approval{width:100%;color:var(--foreground)}
  section{margin-block:24px 32px}
  svg{display:block;width:100%;overflow:hidden}
  .wm-key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;margin-block:12px}
  figure{margin:20px 0}
  figure img{display:block;width:100%;height:auto}
  figcaption{margin-top:8px}
  svg text{font:inherit;fill:var(--foreground)}
  svg .label{paint-order:stroke;stroke:var(--background);stroke-width:4;stroke-linejoin:round}
  svg .water{fill:var(--blue);fill-opacity:.12}
  svg .land{fill:var(--green);fill-opacity:.2}
  svg .sand{fill:var(--yellow);fill-opacity:.32}
  svg .rock{fill:var(--foreground);fill-opacity:.23}
  svg .high{fill:var(--foreground);fill-opacity:.08}
  svg .snow{fill:var(--background)}
  svg .slope{fill:var(--blue);fill-opacity:.1}
  svg .contour{fill:none;stroke:var(--foreground);stroke-width:1;stroke-opacity:.2}
  svg .route{fill:none;stroke:var(--foreground);stroke-width:1.5;stroke-opacity:.65}
  svg .old{fill:none;stroke:var(--foreground);stroke-width:1.5;stroke-dasharray:5 5;stroke-opacity:.5}
  svg .proposed{fill:none;stroke:var(--orange);stroke-width:1.5;stroke-dasharray:7 4}
  svg .pin{fill:var(--background);stroke:var(--foreground);stroke-width:1.2}
  @media(max-width:450px){.wm-key{grid-template-columns:1fr}}
