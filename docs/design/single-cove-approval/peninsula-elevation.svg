halo">Terrace +7 m</text><circle class="pin" cx="460.6" cy="334.5" r="10"></circle><text x="460.6" y="338.5" text-anchor="middle" class="">2</text><text x="12" y="430" text-anchor="start" class="halo">Exposed cliff below tower · not a beach-level mound</text><text x="12" y="480" text-anchor="start" class="halo">B · Unfolded section along the cave</text><path d="M0 746H178.6V678.1999999999999L263.20000000000005 672.1999999999999L319.6 670.4H592.2L695.6 673.4L761.4000000000001 678.8V746H940V762H0Z" class="rock"></path><path d="M178.6 746H761.4000000000001V698Q479.40000000000003 690.8 178.6 698Z" fill="var(--background)" stroke="var(--foreground)" stroke-width="1.5"></path><path d="M0 746H178.6M761.4000000000001 746H940" stroke="var(--yellow)" stroke-width="6"></path><path d="M460.8 670.4L466.8 538.4H492.00000000000006L498.00000000000006 670.4Z" fill="var(--background)" stroke="var(--foreground)" stroke-width="1.5"></path><path d="M463.03200000000004 634.4H495.76800000000003L493.16400000000004 602H465.636Z" fill="var(--red)" fill-opacity=".65"></path><rect x="461.76000000000005" y="531.1999999999999" width="35.28" height="18" fill="var(--yellow)" stroke="var(--foreground)"></rect><path d="M454.20000000000005 531.1999999999999L479.40000000000003 524.6L504.6 531.1999999999999Z" class="rock"></path><path d="M479.40000000000003 674V752" class="cave"></path><text x="470" y="728" text-anchor="middle" class="halo">4 m clear</text><text x="470" y="784" text-anchor="middle" class="halo">Tunnel passes directly beneath tower</text><text x="12" y="764" text-anchor="start" class="halo">Public side</text><text x="928" y="764" text-anchor="end" class="halo">Hidden beach</text><circle class="pin" cx="178.6" cy="722" r="10"></circle><text x="178.6" y="726" text-anchor="middle" class="">2</text><circle class="pin" cx="761.4" cy="722" r="10"></circle><text x="761.4" y="726" text-anchor="middle" class="">3</text><text x="12" y="813" text-anchor="start" class="halo">Section follows tunnel bends; horizontal spacing is illustrative.</text></g><text x="18" y="931">Sea: datum 0 m</text><text x="488" y="931">Beach / tunnel floor: about +0.7 m</text><text x="18" y="957">Terrace: about +7 m above sea</text><text x="488" y="957">Existing tower: 12 m, unchanged</text><text x="18" y="983">Tunnel: 4 m clear height × 3.4 m clear width</text><text x="488" y="983">Rock over tunnel: about 2 m at lighthouse</text><text x="18" y="1017">Approval drawing only · Not implemented · Schematic, not a camera capture</text></svg>