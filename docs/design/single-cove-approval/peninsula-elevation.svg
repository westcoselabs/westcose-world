<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1037" width="940" height="1037"><style>:root{color-scheme:light;--background:#f5f2e8;--foreground:#273e43;--green:#246a4c;--blue:#078bb6;--yellow:#ba8d3e;--red:#c43c36;--orange:#b36d1c;--font-size-base:14px}body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.5 system-ui,sans-serif}main{max-width:940px;margin:auto;padding:24px}h2{font-size:26px;font-weight:500}h3{font-size:19px;font-weight:500}.text-small{font-size:12px}a{color:#176583}.downloads{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0}@media(max-width:460px){main{padding:14px}}
svg{font:14px system-ui,sans-serif}svg text{fill:var(--foreground)}

  #wc-single-cove-approval{color:var(--foreground);width:100%}
  section{margin-block:24px 36px}
  svg{display:block;width:100%;overflow:hidden}
  .wc-key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;margin-block:12px}
  .wc-legend{display:flex;gap:10px 20px;flex-wrap:wrap;margin-block:16px}
  .wc-blue{color:var(--blue)}
  .wc-green{color:var(--green)}
  .wc-red{color:var(--red)}
  svg text{fill:var(--foreground);font:inherit}
  svg .halo{paint-order:stroke;stroke:var(--background);stroke-width:4;stroke-linejoin:round}
  svg .pin{fill:var(--background);stroke:var(--foreground);stroke-width:1.2}
  svg .water{fill:var(--blue);fill-opacity:.13}
  svg .land{fill:var(--green);fill-opacity:.19}
  svg .sand{fill:var(--yellow);fill-opacity:.34}
  svg .rock{fill:var(--foreground);fill-opacity:.25}
  svg .high{fill:var(--foreground);fill-opacity:.09}
  svg .coast{fill:none;stroke:var(--green);stroke-width:2.2}
  svg .trail{fill:none;stroke:var(--blue);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
  svg .cave{fill:none;stroke:var(--foreground);stroke-width:2;stroke-dasharray:5 4}
  svg .route{fill:none;stroke:var(--foreground);stroke-opacity:.6;stroke-width:2}
  svg .proposal{fill:none;stroke:var(--orange);stroke-width:1.5;stroke-dasharray:6 4}
  @media(max-width:460px){.wc-key{grid-template-columns:1fr}}
